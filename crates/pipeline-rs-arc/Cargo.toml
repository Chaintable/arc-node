[package]
name = "pipeline-rs-arc"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Capture and delivery protocol for Arc execution artifacts"
license = "Apache-2.0"
publish.workspace = true

[dependencies]
alloy-primitives = { version = "1.5.7", default-features = false, features = ["serde", "rlp"] }
alloy-rlp = "0.3.13"
flate2 = "1.1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "arbitrary_precision"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10"
tempfile = "3.25"
thiserror = "2.0"

# Match the Arc v0.8.1 execution interface. Storage and delivery can build on their own.
alloy-consensus = { version = "=2.0.4", default-features = false, optional = true }
alloy-evm = { version = "=0.34.0", default-features = false, optional = true }
alloy-genesis = { version = "=2.0.4", default-features = false, optional = true }
alloy-rpc-types-eth = { version = "=2.0.4", default-features = false, features = ["serde"], optional = true }
md-5 = { version = "0.10", optional = true }
revm = { version = "=38.0.0", default-features = false, optional = true }
revm-inspectors = { version = "=0.39.0", optional = true }
sha1 = { version = "0.10", optional = true }

[features]
execution = [
    "dep:alloy-consensus",
    "dep:alloy-evm",
    "dep:alloy-genesis",
    "dep:alloy-rpc-types-eth",
    "dep:md-5",
    "dep:revm",
    "dep:revm-inspectors",
    "dep:sha1",
    "alloy-rlp/derive",
]
s3 = ["dep:aws-sdk-s3"]
kafka = ["dep:rdkafka"]
delivery = ["s3", "kafka", "dep:aws-config", "dep:tokio", "dep:tracing"]

[dependencies.aws-sdk-s3]
version = "=1.96.0"
default-features = false
features = ["rt-tokio"]
optional = true

[dependencies.rdkafka]
version = "=0.37.0"
features = ["cmake-build", "ssl"]
optional = true

[dependencies.aws-config]
version = "=1.8.1"
default-features = false
features = ["rt-tokio", "default-https-client", "credentials-process"]
optional = true

[dependencies.tokio]
version = "1"
features = ["rt", "time", "sync"]
optional = true

[dependencies.tracing]
version = "0.1"
optional = true

[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt", "time"]
