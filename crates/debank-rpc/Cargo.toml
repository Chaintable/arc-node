[package]
name = "debank-rpc"

version.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
exclude.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# RPC
jsonrpsee = { workspace = true, features = ["server", "macros"] }

# Alloy
alloy-consensus = { workspace = true }
alloy-evm = { workspace = true }
alloy-eips = { workspace = true }
alloy-network = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-rpc-types-trace = { workspace = true }
alloy-sol-types = { workspace = true }

# Arc
arc-evm = { workspace = true }

# Reth
reth-ethereum = { workspace = true, features = ["evm"] }
reth-chainspec = { workspace = true }
reth-evm = { workspace = true }
reth-ethereum-primitives = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-provider = { workspace = true }
reth-revm = { workspace = true }
reth-rpc-eth-api = { workspace = true }
reth-rpc-eth-types = { workspace = true }

# Revm
revm = { workspace = true }
revm-inspectors = { workspace = true }

# Serde
serde = { workspace = true }

# Misc
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

# Writer capture contract
alloy-rpc-types-engine.workspace = true
pipeline-rs-arc = { path = "../../../../pipeline-rs-arc.worktrees/feat-arc-writer", features = ["execution"] }
arc-execution-config.workspace = true

[dev-dependencies]
alloy-genesis.workspace = true
