name: release

# Version tags are read from the git ref, so release re-runs keep the same tag.
on:
  release:
    types: [published]

concurrency:
  group: arc-image-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  REGISTRY: public.ecr.aws/b2h7a5c4/chaintable
  CHAINS: "arc"

jobs:
  build-artifacts:
    name: Build ${{ matrix.component }} ${{ matrix.arch }}
    # Same-repository PRs publish review images. External forks cannot receive publishing credentials.
    if: github.repository == 'Chaintable/arc-node' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        component: [execution, consensus]
        include:
          - arch: amd64
            runner: ubuntu2404-linux-x86-64-16c
          - arch: arm64
            runner: ubuntu2204-arm64-16c
          - component: execution
            image_name: arc-node
          - component: consensus
            image_name: arc-consensus
    env:
      IMAGE_NAME: ${{ matrix.image_name }}
      DOCKERFILE: deployments/Dockerfile.${{ matrix.component }}
      BAKE_TARGET: arc-${{ matrix.component }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # Required for the organization public-ECR OIDC role.
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image metadata
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          if [[ "$SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checkout SHA $SHA does not match event SHA $EXPECTED_SHA"
            exit 1
          fi
          SHORT_HASH="${SHA::8}"
          if [[ "$EVENT_NAME" == "release" ]]; then
            [[ "$RELEASE_REF" == refs/tags/* ]] || { echo "::error::Expected a release tag ref"; exit 1; }
            REVISION="${RELEASE_REF#refs/tags/}"
            [[ "$REVISION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo "::error::Invalid image tag"; exit 1; }
            [[ "$(git rev-parse "${RELEASE_REF}^{commit}")" == "$SHA" ]] || { echo "::error::Release tag does not match checkout"; exit 1; }
          else
            REVISION="${SHA::8}"
          fi
          {
            echo "full_hash=$SHA"
            echo "short_hash=$SHORT_HASH"
            echo "git_version=$(git describe --tags --always --dirty)"
            echo "revision=$REVISION"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "294354037686"
          # Organization secret; no repository-specific token or instance credentials.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public # Private ECR login does not authenticate public.ecr.aws.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Push-on-PR is intentional: review the exact SHA image before merging.
      - name: Build and push image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ env.BAKE_TARGET }}
          set: |
            ${{ env.BAKE_TARGET }}.dockerfile=${{ env.DOCKERFILE }}
            ${{ env.BAKE_TARGET }}.platform=linux/${{ matrix.arch }}
            ${{ env.BAKE_TARGET }}.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.revision }}-${{ matrix.arch }}
            ${{ env.BAKE_TARGET }}.output=type=registry
            ${{ env.BAKE_TARGET }}.cache-from=type=gha,scope=arc-${{ matrix.component }}-${{ matrix.arch }}
            ${{ env.BAKE_TARGET }}.cache-to=type=gha,mode=max,scope=arc-${{ matrix.component }}-${{ matrix.arch }}
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
          CI: "true"
          GIT_COMMIT_HASH: ${{ steps.vars.outputs.full_hash }}
          GIT_VERSION: ${{ steps.vars.outputs.git_version }}
          GIT_SHORT_HASH: ${{ steps.vars.outputs.short_hash }}

      - name: Verify image version
        env:
          EXPECTED_SHA: ${{ steps.vars.outputs.full_hash }}
          REVISION: ${{ steps.vars.outputs.revision }}
        run: |
          set -euo pipefail
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:${REVISION}-${{ matrix.arch }}"
          VERSION_OUTPUT="$(docker run --rm --pull=always --platform "linux/${{ matrix.arch }}" "$IMAGE_REF" --version)"
          printf '%s\n' "$VERSION_OUTPUT"
          if ! printf '%s\n' "$VERSION_OUTPUT" | grep -Fqx "Commit SHA: $EXPECTED_SHA"; then
            echo "::error::Image commit does not match checkout: expected $EXPECTED_SHA"
            exit 1
          fi

      - name: Verify runtime shell and utilities
        env:
          REVISION: ${{ steps.vars.outputs.revision }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash .github/scripts/test-runtime-image.sh \
            "${REGISTRY}/${IMAGE_NAME}:${REVISION}-${ARCH}" "arc-node-${COMPONENT}"

  merge-docker-manifest:
    name: Merge ${{ matrix.image_name }} multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-artifacts
    strategy:
      fail-fast: false
      matrix:
        image_name: [arc-node, arc-consensus]
    env:
      IMAGE_NAME: ${{ matrix.image_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image metadata
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          if [[ "$SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checkout SHA $SHA does not match event SHA $EXPECTED_SHA"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "release" ]]; then
            [[ "$RELEASE_REF" == refs/tags/* ]] || { echo "::error::Expected a release tag ref"; exit 1; }
            REVISION="${RELEASE_REF#refs/tags/}"
            [[ "$REVISION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo "::error::Invalid image tag"; exit 1; }
            [[ "$(git rev-parse "${RELEASE_REF}^{commit}")" == "$SHA" ]] || { echo "::error::Release tag does not match checkout"; exit 1; }
          else
            REVISION="${SHA::8}"
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "294354037686"
          # Organization secret; no repository-specific token or instance credentials.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public # Private ECR login does not authenticate public.ecr.aws.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create and inspect manifest
        env:
          REVISION: ${{ steps.vars.outputs.revision }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${REVISION}" \
            "${REGISTRY}/${IMAGE_NAME}:${REVISION}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${REVISION}-arm64"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${REVISION}"
          # Only the execution image has Writer aliases; never alias consensus as Writer.
          if [[ "$IMAGE_NAME" == "arc-node" ]]; then
            for chain in ${CHAINS}; do
              docker buildx imagetools create \
                --tag "${REGISTRY}/${chain}-writer:${REVISION}" \
                "${REGISTRY}/${IMAGE_NAME}:${REVISION}"
              docker buildx imagetools inspect "${REGISTRY}/${chain}-writer:${REVISION}"
            done
          fi
