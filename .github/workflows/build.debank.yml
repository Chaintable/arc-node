name: "Build artifacts (DeBank)"

on:
  pull_request:
    branches:
      - "debank"
  release:
    types:
      - created
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  REGISTRY: 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com
  IMAGE: blockchain-arc-x-execution
  BAKE_TARGET: arc-execution

jobs:
  build-artifacts:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: [self-hosted, "${{ matrix.arch }}"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set REVISION
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "REVISION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          else
            echo "REVISION=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
          fi

      - name: Compute short hash
        id: vars
        env:
          SHA: ${{ github.sha }}
        run: echo "short_hash=${SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ env.BAKE_TARGET }}
          set: |
            ${{ env.BAKE_TARGET }}.platform=linux/${{ matrix.arch }}
            ${{ env.BAKE_TARGET }}.tags=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.arch }}-${{ env.REVISION }}
            ${{ env.BAKE_TARGET }}.output=type=registry
        env:
          CI: "true"
          GIT_COMMIT_HASH: ${{ github.sha }}
          GIT_VERSION: ${{ env.REVISION }}
          GIT_SHORT_HASH: ${{ steps.vars.outputs.short_hash }}

  merge-docker-manifest:
    runs-on: [self-hosted, general]
    needs: build-artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set REVISION
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "REVISION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          else
            echo "REVISION=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Merge multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE}:${REVISION}" \
            "${REGISTRY}/${IMAGE}:amd64-${REVISION}" \
            "${REGISTRY}/${IMAGE}:arm64-${REVISION}"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${REVISION}"
